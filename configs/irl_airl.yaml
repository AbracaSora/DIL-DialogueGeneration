extends: "configs/base.yaml"
experiment_name: "airl_reward"

irl:
  history_turns: 2
  state_dim: 512
  action_dim: 512
  hidden_dim: 256
  disc_steps_per_epoch: 200
  policy_steps_per_epoch: 200
  expert_batch_size: 64
  policy_batch_size: 64
  alpha: 0.5
  entropy_coef: 0.01
  mode: "airl" # "airl" or "maxent"

train:
  epochs: 5
  batch_size: 32
  lr: 0.0002
