seed: 42
device: "cuda"
output_root: "outputs"

data:
  train_path: "data/train.jsonl"
  valid_path: "data/valid.jsonl"
  test_path: "data/test.jsonl"
  max_vocab_size: 30000
  max_src_len: 64
  max_tgt_len: 32
  num_workers: 2

train:
  batch_size: 32
  epochs: 5
  lr: 0.0005
  grad_clip: 1.0
  fp16: true
  log_every: 100
  save_every_epoch: true

model:
  embed_dim: 256
  hidden_dim: 512
  num_layers: 1
  dropout: 0.2
